[build]
  publish = "."
  functions = "netlify/functions"

# Sitio antiguo: todo redirige al dominio oficial (hospedado en Cloudflare)
[[redirects]]
  from = "/*"
  to = "https://ateneapiuraperu.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
